<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NovelCraft</title><link rel="stylesheet" href="app.css"></head>
<body>

<!-- Bookshelf -->
<div class="page" id="bookshelfPage">
  <div class="topbar">
    <span class="topbar-title">📚 我的书架</span>
    <button class="topbar-btn" onclick="showSettings()">⚙</button>
  </div>
  <div class="book-grid" id="bookGrid"></div>
  <button class="fab" onclick="createBook()">+</button>
</div>

<!-- Writing page -->
<div class="page hidden" id="writePage">
  <div class="topbar">
    <button class="topbar-btn" onclick="showBookshelf()">←</button>
    <span class="topbar-title" id="bookTitle">书名</span>
    <button class="topbar-btn" onclick="showBookMenu()">⋯</button>
  </div>
  <div class="write-area" id="writeArea">
    <div id="chapterContent"></div>
  </div>
  <div class="write-input-wrap">
    <div class="write-input-row">
      <div class="write-input-box">
        <textarea id="writeInput" rows="1" placeholder="告诉 AI 你想写什么..." oninput="autoResize(this)"></textarea>
      </div>
      <button class="write-send" id="writeSend" onclick="sendWrite()">↑</button>
    </div>
    <div class="write-chips">
      <button class="chip" onclick="sendCmd('继续写')">续写</button>
      <button class="chip" onclick="sendCmd('润色这段')">润色</button>
      <button class="chip" onclick="sendCmd('换个写法')">改写</button>
      <button class="chip" onclick="sendCmd('扩写')">扩写</button>
    </div>
  </div>
</div>

<!-- Settings page -->
<div class="page hidden" id="settingsPage">
  <div class="topbar">
    <button class="topbar-btn" onclick="hideSettings()">←</button>
    <span class="topbar-title">设置</span>
  </div>
  <div class="settings-body">
    <div class="fold"><div class="fold-head" onclick="toggleFold(this)"><span>🔑 DeepSeek API</span><span class="fold-arrow">›</span></div><div class="fold-body">
      <label>API Key<input id="cfgApiKey" type="password" placeholder="sk-..."></label>
      <label>模型<select id="cfgModel"><option value="deepseek-chat">deepseek-chat</option><option value="deepseek-v4-flash">deepseek-v4-flash</option></select></label>
      <button class="primary" onclick="saveApiKey()">保存</button>
    </div></div>
    <div class="fold"><div class="fold-head" onclick="toggleFold(this)"><span>📖 写作偏好</span><span class="fold-arrow">›</span></div><div class="fold-body">
      <label>默认风格<select id="cfgStyle"><option value="玄幻">玄幻</option><option value="科幻">科幻</option><option value="悬疑">悬疑</option><option value="言情">言情</option><option value="都市">都市</option><option value="历史">历史</option><option value="武侠">武侠</option><option value="奇幻">奇幻</option></select></label>
      <label>每章字数<select id="cfgWordCount"><option value="2000">2000字</option><option value="3000" selected>3000字</option><option value="5000">5000字</option></select></label>
    </div></div>
  </div>
</div>

<script src="app.js"></script>
</body></html>
